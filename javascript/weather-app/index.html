<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="CleverClimate - Real-time weather for any city in the world, powered by Visual Crossing." />
    <title>CleverClimate</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />


</head>

<body>

    <header class="hero">
        <div class="hero__brand">
            <span class="hero__logo">🌤️</span>
            <span class="hero__name">CleverClimate</span>
        </div>

        <h1 class="hero__headline">
            Every other app let you down?<br />
            <span class="hero__highlight">We've got the forecast you need.</span>
        </h1>
        <p class="hero__sub">
            Accurate, real-time weather for any city on the planet —
            beautifully presented, right when you need it.
        </p>

        <form id="searchForm" class="search" novalidate>
            <div class="search__input-wrap">
                <input type="text" id="locationInput" class="search__input"
                    placeholder="Search a city… e.g. Tokyo, Buenos Aires" autocomplete="off" aria-label="City name" />
                <button type="submit" id="searchBtn" class="search__btn" aria-label="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"
                        aria-hidden="true">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                </button>
            </div>

            <div class="unit-toggle" role="group" aria-label="Temperature unit">
                <button type="button" id="btnCelsius" class="unit-toggle__btn unit-toggle__btn--active"
                    data-unit="C">°C</button>
                <button type="button" id="btnFahrenheit" class="unit-toggle__btn" data-unit="F">°F</button>
            </div>
        </form>
    </header>

    <main id="main">

        <div id="loader" class="loader hidden" aria-live="polite" aria-label="Loading weather data">
            <div class="loader__ring"></div>
            <p class="loader__text">Fetching weather data…</p>
        </div>

        <div id="errorMsg" class="error hidden" role="alert"></div>

        <section id="results" class="results hidden" aria-live="polite"></section>

    </main>

    <footer class="footer">
        <p>
            Built by
            <a href="https://github.com/MarcosDebona25" target="_blank" rel="noopener noreferrer">
                MarcosDebona25
            </a>
            · Powered by
            <a href="https://www.visualcrossing.com/" target="_blank" rel="noopener noreferrer">
                Visual Crossing Weather API
            </a>
        </p>
    </footer>

    <script src="config.js"></script>
    <script src="getWeather.js"></script>
    <script src="script.js"></script>
</body>

</html>
