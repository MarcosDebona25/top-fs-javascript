<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="code.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>

<body>

    <div id="app">

        <header id="header">
            <h1>My Library</h1>
            <button id="new-book" type="button">+ Add a new book</button>
        </header>

        <main>
            <div id="container"></div>
        </main>

        <footer id="footer">
            <p id="stats"></p>
        </footer>

    </div>

    <dialog id="book-modal">
        <form id="book-form">
            <h2>Add a new book</h2>

            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required placeholder="Book title">
            </div>

            <div class="form-group">
                <label for="author">Author</label>
                <input type="text" id="author" name="author" required placeholder="Author name">
            </div>

            <div class="form-group">
                <label for="pages">Number of pages</label>
                <input type="number" id="pages" name="pages" required min="1" placeholder="e.g. 320">
            </div>

            <div class="form-group checkbox-group">
                <label for="read">Already read?</label>
                <input type="checkbox" id="read" name="read">
            </div>

            <div class="form-actions">
                <button type="button" id="cancel-btn">Cancel</button>
                <button type="submit">Add Book</button>
            </div>
        </form>
    </dialog>

</body>

</html>
